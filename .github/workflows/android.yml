name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: .local/voice
          key: voice-${{ hashFiles('scripts/fetch-voice-assets.ps1') }}
      - run: pwsh scripts/fetch-voice-assets.ps1
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
